<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#222222">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#222; --fg:#fff; --muted:#8a8a8a; --line:#3a3a3a;
    --h0:#2e2e2e; --heat:#c9805f;
  }
  :root[data-theme=light] {
    --bg:#efe8da; --fg:#2a2520; --muted:#857c70; --line:#d9cfbd;
    --h0:#e2d9c8; --heat:#b5654a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:400 17px/1.5 Archivo, system-ui, sans-serif; transition:background .2s, color .2s; }
  button { background:none; border:0; color:inherit; font:inherit; cursor:pointer; padding:0; }

  .wrap { max-width:1200px; margin:0 auto; padding:56px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:64px; }
  h1 { font:400 64px/1 Anton, Impact, sans-serif; margin:0; letter-spacing:.01em; }

  .theme { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); text-transform:lowercase; }
  .switch { width:34px; height:18px; border-radius:9px; background:var(--fg); position:relative; }
  .switch::after { content:''; position:absolute; top:3px; left:19px; width:12px; height:12px; border-radius:50%; background:var(--bg); transition:left .2s; }
  :root[data-theme=light] .switch::after { left:3px; }

  .grid { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:96px; align-items:start; }

  form input { width:100%; padding:8px 2px; font:inherit; color:var(--fg); background:none; border:0; border-bottom:2px solid var(--fg); outline:none; }
  form input::placeholder { color:var(--muted); }
  ul { list-style:none; padding:0; margin:40px 0 0; }
  li { display:flex; align-items:center; gap:18px; padding:10px 0; }
  li span { flex:1; word-break:break-word; cursor:text; outline:none; }
  li.done span { color:var(--muted); text-decoration:line-through; text-decoration-thickness:2px; }
  .box { appearance:none; flex:none; width:26px; height:26px; margin:0; border:3px solid var(--fg); cursor:pointer; display:grid; place-content:center; }
  .box:checked { background:var(--fg); }
  .box:checked::after { content:''; width:10px; height:5px; border:solid var(--bg); border-width:0 0 3px 3px; transform:translateY(-2px) rotate(-45deg); }
  .del { color:var(--muted); opacity:0; font-size:14px; } li:hover .del { opacity:1; } .del:hover { color:var(--fg); }
  @media (hover:none) { .del { opacity:1; } }
  .count { margin-top:24px; color:var(--muted); font-size:13px; }

  aside { width:max-content; }
  .streak { display:flex; gap:40px; margin-bottom:28px; }
  .stat b { display:block; font:400 48px/1 Anton, Impact, sans-serif; }
  .stat small { color:var(--muted); font-size:12px; text-transform:lowercase; }
  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,13px); grid-auto-columns:13px; gap:3px; }
  /* --i (0–1) is the day's brightness step; empty days stay --h0 */
  .heat button { border-radius:2px; background:var(--h0); }
  .heat button[style] { background:color-mix(in srgb, var(--heat) calc(25% + var(--i) * 75%), var(--h0)); }
  .heat button.sel { outline:2px solid var(--fg); outline-offset:1px; }
  .heat .pad { visibility:hidden; }
  .day { margin-top:28px; max-width:300px; }
  .day h2 { font-size:12px; color:var(--muted); text-transform:lowercase; font-weight:600; margin:0 0 8px; }
  .day ul { margin:0; } .day li { padding:4px 0; gap:12px; font-size:15px; }
  .day .box { width:18px; height:18px; border-width:2px; }
  .day .box:checked::after { width:7px; height:3px; border-width:0 0 2px 2px; }
  .day p { color:var(--muted); font-size:14px; margin:0; }

  @media (max-width:900px) {
    .wrap { padding:32px 16px; } header { margin-bottom:40px; } h1 { font-size:48px; }
    .grid { grid-template-columns:1fr; gap:56px; }
    aside { width:100%; overflow-x:auto; }
  }
  /* Compact layout for the menu bar panel and small windows */
  @media (max-width:500px) {
    body { font-size:14px; }
    .wrap { padding:20px 18px; } header { margin-bottom:20px; } h1 { font-size:30px; }
    .grid { gap:28px; }
    form input { padding:6px 1px; border-bottom-width:1.5px; }
    ul { margin-top:16px; } li { gap:12px; padding:6px 0; }
    .box { width:18px; height:18px; border-width:2px; }
    .box:checked::after { width:7px; height:3px; border-width:0 0 2px 2px; }
    .count { margin-top:12px; font-size:12px; }
    .streak { gap:24px; margin-bottom:14px; }
    .stat b { font-size:26px; } .stat small { font-size:11px; }
    .heat { grid-template-rows:repeat(7,9px); grid-auto-columns:9px; gap:2px; }
    .day { margin-top:16px; } .day li { font-size:13px; }
  }
</style>
<script>
  // Apply saved theme before paint (default: dark)
  try { if (localStorage.getItem('minimal-todo-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TO DO</h1>
    <button class="theme" id="theme" aria-label="Toggle light and dark mode"><span id="themeLabel">dark</span><span class="switch"></span></button>
  </header>
  <div class="grid">
    <section>
      <form id="f"><input id="new" placeholder="what’s next?" autocomplete="off" autofocus></form>
      <ul id="list"></ul>
      <div class="count" id="count"></div>
    </section>
    <aside>
      <div class="streak">
        <div class="stat"><b id="cur">0</b><small>day streak</small></div>
        <div class="stat"><b id="best">0</b><small>best</small></div>
        <div class="stat"><b id="total">0</b><small>done</small></div>
      </div>
      <div class="heat" id="heat"></div>
      <div class="day" id="day"></div>
    </aside>
  </div>
</div>
<script>
  const KEY = 'minimal-todo', WEEKS = 20;
  // Task: { id, text, done, doneOn: 'YYYY-MM-DD' | null }
  let todos = [], selected = null;
  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
  todos.forEach(t => { t.id ??= crypto.randomUUID(); if (t.done && !t.doneOn) t.doneOn = ymd(new Date()); });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} };
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);

  function ymd(d) { return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  const today = () => ymd(new Date());
  const isArchived = t => t.done && t.doneOn < today();
  const remove = t => { todos = todos.filter(x => x !== t); };

  function row(t) {
    const li = el('li', { className: t.done ? 'done' : '' });
    const cb = el('input', { type:'checkbox', className:'box', checked:t.done });
    cb.onchange = () => { t.done = cb.checked; t.doneOn = t.done ? today() : null; update(); };
    const span = el('span', { textContent:t.text, title:'Double-click to edit' });
    span.ondblclick = () => {
      span.contentEditable = true; span.focus();
      span.onblur = () => { const v = span.textContent.trim(); v ? t.text = v : remove(t); update(); };
      span.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); span.blur(); } if (e.key === 'Escape') { span.textContent = t.text; span.blur(); } };
    };
    const del = el('button', { className:'del', textContent:'✕', title:'Delete' });
    del.onclick = () => { remove(t); update(); };
    li.append(cb, span, del);
    return li;
  }

  function renderStats() {
    const perDay = {};
    todos.forEach(t => { if (t.done) perDay[t.doneOn] = (perDay[t.doneOn] || 0) + 1; });

    // Current streak: consecutive days ending today (or yesterday, if nothing done yet today)
    let d = new Date(), cur = 0;
    if (!perDay[ymd(d)]) d = addDays(d, -1);
    while (perDay[ymd(d)]) { cur++; d = addDays(d, -1); }
    let best = 0, run = 0, prev = null;
    Object.keys(perDay).sort().forEach(k => {
      run = prev && ymd(addDays(new Date(prev + 'T00:00'), 1)) === k ? run + 1 : 1;
      best = Math.max(best, run); prev = k;
    });
    $('cur').textContent = cur; $('best').textContent = best;
    $('total').textContent = Object.values(perDay).reduce((a, b) => a + b, 0);

    // Heatmap: WEEKS columns, Sunday-first rows, ending with the current week
    const now = new Date(), start = addDays(now, -now.getDay() - (WEEKS - 1) * 7);
    // Fixed brightness steps: 1, 2–3, 4–6, 7–9, 10+ tasks
    const level = n => n >= 10 ? 1 : n >= 7 ? .75 : n >= 4 ? .5 : n >= 2 ? .25 : 0;
    const cells = [];
    for (let i = 0; i < WEEKS * 7; i++) {
      const day = addDays(start, i), k = ymd(day), n = perDay[k] || 0;
      if (day > now) { cells.push(el('span', { className:'pad' })); continue; }
      const b = el('button', {
        title: `${n} done · ${day.toLocaleDateString(undefined, { month:'short', day:'numeric' })}`,
        className: k === selected ? 'sel' : ''
      });
      if (n) b.style.setProperty('--i', level(n));
      b.onclick = () => { selected = selected === k ? null : k; render(); };
      cells.push(b);
    }
    $('heat').replaceChildren(...cells);

    const box = $('day');
    if (!selected) { box.replaceChildren(); return; }
    const done = todos.filter(t => t.done && t.doneOn === selected);
    const label = new Date(selected + 'T00:00').toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
    box.replaceChildren(el('h2', { textContent:label }),
      done.length ? (() => { const ul = el('ul'); ul.append(...done.map(row)); return ul; })() : el('p', { textContent:'nothing done this day' }));
  }

  function render() {
    const active = todos.filter(t => !isArchived(t));
    $('list').replaceChildren(...active.map(row));
    const left = active.filter(t => !t.done).length;
    $('count').textContent = active.length ? `${left} left` : '';
    renderStats();
  }
  function update() { save(); render(); }

  $('f').onsubmit = e => {
    e.preventDefault();
    const text = $('new').value.trim();
    if (text) { todos.push({ id:crypto.randomUUID(), text, done:false, doneOn:null }); $('new').value = ''; update(); }
  };

  const setThemeLabel = () => $('themeLabel').textContent = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  $('theme').onclick = () => {
    const light = document.documentElement.dataset.theme !== 'light';
    light ? document.documentElement.dataset.theme = 'light' : delete document.documentElement.dataset.theme;
    try { localStorage.setItem('minimal-todo-theme', light ? 'light' : 'dark'); } catch {}
    setThemeLabel();
  };
  setThemeLabel();

  // Keep multiple open copies (e.g. Mac app window + menu bar panel) in sync
  window.addEventListener('storage', e => {
    if (e.key === KEY) { try { todos = JSON.parse(e.newValue) || []; } catch {} render(); }
    if (e.key === 'minimal-todo-theme') {
      e.newValue === 'light' ? document.documentElement.dataset.theme = 'light' : delete document.documentElement.dataset.theme;
      setThemeLabel();
    }
  });
  // Re-render when the app regains focus, so yesterday's completed tasks archive after midnight
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
